<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1714"><title>Nhà Ngô · Đơn đặt trước</title>
<style>
@font-face{font-family:Auckland;src:url('./MTD%20Auckland%20Script.otf') format('opentype');font-display:swap}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#191512;color:#f7eee4;font-family:'Be Vietnam Pro',sans-serif}.app{max-width:680px;margin:auto;padding:18px 14px 110px}.brand{font-family:Auckland,serif;font-size:34px;font-weight:400;color:#fff5e8}.sub{color:#c5ad99;font-size:12px;margin-top:-4px}.top{display:flex;justify-content:space-between;align-items:center}.icon{border:1px solid #4b3b31;background:#29211c;color:#f4dfca;width:43px;height:43px;border-radius:13px;font-size:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#241e1a;border:1px solid #3d3028;border-radius:15px;padding:12px}.stat b{display:block;font-size:21px;color:#f1b06d}.stat small{color:#bda898;font-size:10px}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.filter{white-space:nowrap;border:1px solid #49382d;background:#241e1a;color:#cdb8a7;border-radius:999px;padding:9px 13px;font:600 12px inherit}.filter.on{background:#a84d1c;color:#fff;border-color:#a84d1c}.section{font-size:13px;color:#d8c2b0;margin:18px 2px 8px;font-weight:700}.card{background:#28211c;border:1px solid #43352c;border-radius:18px;padding:15px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px}.id{color:#bfa997;font-size:11px}.name{font-size:17px;font-weight:800;margin:3px 0}.cake{color:#efb275;font-weight:700;font-size:14px}.time{font-size:17px;font-weight:800;text-align:right}.date{color:#c9b3a1;font-size:11px;text-align:right}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{padding:6px 9px;border-radius:9px;background:#352a23;color:#dbc8b8;font-size:11px;font-weight:700}.tag.money{background:#4a2a19;color:#ffc88f}.tag.ready{background:#243a2d;color:#bce1c7}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),652px);height:58px;border:0;border-radius:17px;background:#b45420;color:#fff7ed;font:800 16px inherit;box-shadow:0 10px 30px #0008}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:680px;max-height:94dvh;overflow:auto;margin:auto;background:#211b17;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:9px;background:#655145;margin:0 auto 15px}.sheet h2{font-family:Auckland,serif;font-size:30px;font-weight:400;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;color:#cbb6a5;font-size:11px;font-weight:700;margin:4px 0 5px}input,select,textarea{width:100%;border:1px solid #4b3b31;background:#302720;color:#fff4e8;border-radius:12px;padding:12px;font:500 14px inherit}textarea{min-height:72px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:8px;margin-top:15px}.btn{border:0;border-radius:13px;min-height:49px;font:800 14px inherit}.secondary{background:#352b24;color:#d8c5b6}.primary{background:#b45420;color:white}.empty{text-align:center;color:#a99280;padding:45px 10px}.setup{background:#39291f;border:1px solid #6a4935;padding:13px;border-radius:14px;color:#e5c6ac;font-size:12px;margin:14px 0}
</style></head><body><main class="app"><div class="top"><div><div class="brand">Nhà Ngô</div><div class="sub">QUẢN LÝ ĐƠN ĐẶT TRƯỚC</div></div><button class="icon" onclick="settings()">⚙</button></div><div id="setup"></div><div class="stats"><div class="stat"><b id="todayN">0</b><small>TRẢ HÔM NAY</small></div><div class="stat"><b id="makingN">0</b><small>ĐANG LÀM</small></div><div class="stat"><b id="dueN">0</b><small>CÒN PHẢI THU</small></div></div><div class="filters" id="filters"></div><div class="section" id="section">ĐƠN SẮP TRẢ</div><div id="list"><div class="empty">Đang tải đơn...</div></div></main><button class="fab" onclick="openForm()">＋ Tạo đơn đặt trước</button><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const DEFAULT_API='https://script.google.com/macros/s/AKfycbyYGBlJNMmAspXdkIOYSdzccD6boaovj1Di1tAon5Mv7VpO6EKmtgUHPafGS1xosTqhSw/exec';let API=localStorage.getItem('ngo_preorder_api')||DEFAULT_API;let orders=[],filter='ACTIVE';const $=id=>document.getElementById(id),money=n=>(+n||0).toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function jsonp(p){return new Promise((ok,no)=>{if(!API)return no(Error('Chưa cấu hình Apps Script'));let cb='cb'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();ok(r)};s.onerror=()=>no(Error('Không kết nối được Apps Script'));s.src=API+'?'+new URLSearchParams({...p,callback:cb,_:Date.now()});document.body.appendChild(s)})}
async function load(){if(!API){$('setup').innerHTML='<div class="setup">Bước cuối: bấm ⚙ và dán URL Web App của Apps Script.</div>';$('list').innerHTML='<div class="empty">Chưa kết nối dữ liệu.</div>';renderFilters();return}try{let r=await jsonp({api:'orders'});orders=(r.orders||[]).map(normalizeOrder);render()}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderFilters(){let a=[['ACTIVE','Đang xử lý'],['TODAY','Hôm nay'],['READY','Sẵn sàng'],['DONE','Đã trả'],['ALL','Tất cả']];$('filters').innerHTML=a.map(x=>'<button class="filter '+(filter===x[0]?'on':'')+'" onclick="filter=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')}
function ymd(d){let x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}function today(){return ymd(new Date())}
function cleanDate(v){if(!v)return '';if(/^\\d{4}-\\d{2}-\\d{2}$/.test(v))return v;let d=new Date(v);if(isNaN(d))return v;return ymd(d)}
function cleanTime(v){if(!v)return '';if(/^\\d{1,2}:\\d{2}/.test(v)){let p=v.match(/^(\\d{1,2}):(\\d{2})/);return String(p[1]).padStart(2,'0')+':'+p[2]}let d=new Date(v);if(isNaN(d))return v;return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function normalizeOrder(o){o.pickupDate=cleanDate(o.pickupDate);o.pickupTime=cleanTime(o.pickupTime);return o}
function render(){renderFilters();$('setup').innerHTML='';$('todayN').textContent=orders.filter(o=>o.pickupDate===today()&&o.progress!=='ĐÃ TRẢ'&&o.progress!=='HỦY').length;$('makingN').textContent=orders.filter(o=>o.progress==='ĐANG LÀM').length;$('dueN').textContent=money(orders.filter(o=>o.progress!=='ĐÃ TRẢ'&&o.progress!=='HỦY').reduce((s,o)=>s+(+o.remaining||0),0)).replace('đ','');
let list=orders.filter(o=>filter==='ALL'||filter==='DONE'?o.progress==='ĐÃ TRẢ':filter==='TODAY'?o.pickupDate===today()&&o.progress!=='ĐÃ TRẢ':filter==='READY'?o.progress==='SẴN SÀNG':o.progress!=='ĐÃ TRẢ'&&o.progress!=='HỦY');list.sort((a,b)=>(a.pickupDate+a.pickupTime).localeCompare(b.pickupDate+b.pickupTime));$('section').textContent=filter==='DONE'?'ĐƠN ĐÃ TRẢ':'ĐƠN SẮP TRẢ';$('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Không có đơn trong mục này.</div>'}
function card(o){return '<div class="card" onclick="openForm(\''+esc(o.id)+'\')"><div class="row"><div><div class="id">'+esc(o.id)+'</div><div class="name">'+esc(o.name)+'</div><div class="cake">'+esc(o.cake)+'</div></div><div><div class="time">'+esc(o.pickupTime||'--:--')+'</div><div class="date">'+esc(o.pickupDate||'')+'</div></div></div><div class="meta"><span class="tag">'+esc(o.progress)+'</span><span class="tag">'+esc(o.receiveType)+'</span>'+(+o.remaining?'<span class="tag money">Còn thu '+money(o.remaining)+'</span>':'')+'</div></div>'}
function field(label,id,val='',type='text',cls=''){return '<div class="'+cls+'"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function sel(label,id,val,opts,cls=''){return '<div class="'+cls+'"><label>'+label+'</label><select id="'+id+'">'+opts.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'}
function openForm(id=''){let o=orders.find(x=>x.id===id)||{};modal.classList.add('on');sheet.innerHTML='<div class="handle"></div><h2>'+(id?'Chi tiết đơn':'Tạo đơn mới')+'</h2><div class="grid">'+field('Tên khách','fName',o.name,'text','full')+field('Số điện thoại','fPhone',o.phone,'tel')+field('Loại bánh','fCake',o.cake)+field('Tuổi','fAge',o.age,'number')+field('Tổng tiền','fTotal',o.total,'number')+field('Nội dung trên bánh','fContent',o.content,'text','full')+field('Tiền cọc','fDeposit',o.deposit,'number')+sel('Thanh toán','fPayment',o.payment||'CHƯA THANH TOÁN',['CHƯA THANH TOÁN','ĐÃ CỌC','ĐÃ THANH TOÁN'])+field('Ngày lấy','fDate',o.pickupDate||today(),'date')+field('Giờ lấy','fTime',o.pickupTime||'','time')+sel('Nhận bánh','fReceive',o.receiveType||'TẠI TIỆM',['TẠI TIỆM','GIAO HÀNG'])+sel('Tiến độ','fProgress',o.progress||'CHỜ LÀM',['CHỜ LÀM','ĐANG LÀM','SẴN SÀNG','ĐÃ TRẢ','HỦY'])+field('Địa chỉ giao','fAddress',o.address,'text','full')+'<div class="full"><label>Ghi chú</label><textarea id="fNote">'+esc(o.note||'')+'</textarea></div></div><div class="actions"><button class="btn secondary" onclick="closeM()">Đóng</button><button class="btn primary" onclick="save(\''+esc(id)+'\')">'+(id?'Lưu thay đổi':'Tạo đơn')+'</button></div>'}
async function save(id){if(!API)return settings();let d={id,name:fName.value.trim(),phone:fPhone.value.trim(),cake:fCake.value.trim(),age:fAge.value,content:fContent.value.trim(),total:+fTotal.value||0,deposit:+fDeposit.value||0,payment:fPayment.value,pickupDate:fDate.value,pickupTime:fTime.value,receiveType:fReceive.value,address:fAddress.value.trim(),progress:fProgress.value,note:fNote.value.trim()};if(!d.name||!d.cake||!d.pickupDate)return alert('Nhập Tên khách, Loại bánh và Ngày lấy.');let form=document.createElement('form');form.method='post';form.action=API;form.target='sink';form.style.display='none';let inp=document.createElement('input');inp.name='payload';inp.value=JSON.stringify({api:'save-order',order:d});form.appendChild(inp);document.body.appendChild(form);let fr=$('sink');if(!fr){fr=document.createElement('iframe');fr.id='sink';fr.name='sink';fr.style.display='none';document.body.appendChild(fr)}form.submit();form.remove();closeM();setTimeout(load,1000)}
function settings(){let u=prompt('Dán URL Web App Apps Script:',API);if(u!==null){API=u.trim();localStorage.setItem('ngo_preorder_api',API);load()}}function closeM(){modal.classList.remove('on')}load();
</script></body></html>
