<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>Tiệm Bánh Nhà Ngô</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf2;color:#2c2925;font-family:system-ui,-apple-system,Arial,sans-serif;padding-bottom:100px}.wrap{max-width:600px;margin:auto;padding:20px 14px}h1{margin:4px 0;font-size:28px;color:#513725}.sub{color:#777;margin:6px 0 20px}.card{background:#fff;border:1px solid #eee5d9;border-radius:18px;padding:16px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 3px 14px #3c28140d}.pinfo{display:flex;align-items:center;gap:13px;min-width:0;flex:1}.pimg{width:88px;height:88px;object-fit:cover;border-radius:14px;flex:0 0 88px;background:#f1ebe4}.name{font-size:18px;font-weight:800}.price{font-size:18px;font-weight:800;color:#513725;margin-top:7px}.stock{font-size:12px;color:#287a45;margin-top:5px}.qty{display:flex;align-items:center;gap:7px;background:#f7f3ed;padding:5px;border-radius:15px}.qty button{width:46px;height:46px;border:0;border-radius:12px;background:white;font-size:25px}.qty b{min-width:28px;text-align:center;font-size:18px}.bar{position:fixed;bottom:0;left:0;right:0;background:#fffaf2f5;border-top:1px solid #eee5d9;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:8}.barin{max-width:600px;margin:auto;display:grid;grid-template-columns:1fr 1.15fr;gap:10px;align-items:center}.sum small{display:block;color:#777}.sum strong{font-size:21px;color:#513725}.primary{width:100%;min-height:54px;border:0;border-radius:15px;background:#513725;color:#fff;font-size:16px;font-weight:800}.primary:disabled{opacity:.5}.modal{display:none;position:fixed;z-index:20;inset:0;background:#0008;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:600px;margin:auto;background:white;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.handle{width:42px;height:5px;background:#ddd;border-radius:8px;margin:0 auto 14px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea{width:100%;font-size:16px;padding:14px;border:1px solid #ddd5cb;border-radius:13px}textarea{min-height:72px}.qrbox{text-align:center;background:#fff;border:1px solid #eee5d9;border-radius:16px;padding:14px;margin:12px 0}.qrbox img{width:min(250px,75vw);height:auto;border-radius:10px}.proof{margin:14px 0;padding:14px;background:#f8f4ee;border-radius:14px}.proof input{background:#fff}.preview{display:none;margin-top:10px;width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#fff}.totalbox{display:flex;justify-content:space-between;background:#f8f4ee;padding:14px;border-radius:13px;margin:18px 0}.bank{background:#f7f4ef;padding:16px;border-radius:15px;line-height:1.8}.pay{font-size:28px;font-weight:900;color:#513725}.hint{font-size:13px;color:#777;line-height:1.5}.secondary{width:100%;min-height:46px;border:0;background:transparent;color:#777;font-weight:700}.ok{text-align:center;padding:18px}.tick{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#e8f5ec;color:#287a45;font-size:32px;margin:auto}
</style></head><body>
<main class="wrap"><h1>🍞 Tiệm Bánh Nhà Ngô</h1><div class="sub">Chọn bánh và số lượng bạn muốn đặt</div><div id="products">Đang tải thực đơn...</div></main>
<div class="bar"><div class="barin"><div class="sum"><small id="qt">Chưa chọn bánh</small><strong id="total">0 đ</strong></div><button class="primary" id="order" disabled onclick="openOrder()">Đặt bánh</button></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<iframe name="submitFrame" style="display:none"></iframe><form id="postForm" method="post" target="submitFrame" action="https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec" style="display:none"><input name="payload" id="payload"></form>
<script>
const API='https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec';const PRODUCT_IMAGES={B001:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80',B002:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80',B003:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80',B004:'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=500&q=80',B005:'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=500&q=80',B006:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80'};let products=[],cart={};const money=n=>(+n||0).toLocaleString('vi-VN')+' đ';
function receiveProducts(d){products=d||[];products.forEach(p=>cart[p.id]=0);render()}
function load(){let s=document.createElement('script');s.src=API+'?api=products&callback=receiveProducts&_='+Date.now();s.onerror=()=>document.getElementById('products').innerHTML='Không tải được thực đơn.';document.body.appendChild(s)}
function render(){document.getElementById('products').innerHTML=products.map(p=>`<div class="card"><div class="pinfo"><img class="pimg" src="${PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006}" alt="${p.name}" loading="lazy"><div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div><div class="stock">Còn ${p.stock} bánh</div></div></div><div class="qty"><button onclick="chg('${p.id}',-1)">−</button><b id="q-${p.id}">0</b><button onclick="chg('${p.id}',1)">+</button></div></div>`).join('');calc()}
function chg(id,n){let p=products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(+p.stock,(cart[id]||0)+n));document.getElementById('q-'+id).textContent=cart[id];calc()}
function totals(){let qty=0,total=0;products.forEach(p=>{let q=cart[p.id]||0;qty+=q;total+=q*p.price});return{qty,total}}
function calc(){let t=totals();total.textContent=money(t.total);qt.textContent=t.qty?t.qty+' bánh đã chọn':'Chưa chọn bánh';order.disabled=!t.qty;return t}
function openOrder(){let t=calc();modal.classList.add('on');sheet.innerHTML=`<div class="handle"></div><h2>Thông tin nhận bánh</h2><label>Tên khách hàng</label><input id="name" autocomplete="name"><label>Số điện thoại</label><input id="phone" inputmode="tel"><label>Ghi chú</label><textarea id="note"></textarea><div class="totalbox"><span>${t.qty} bánh</span><strong>${money(t.total)}</strong></div><button class="primary" onclick="pay()">Tiếp tục thanh toán</button><button class="secondary" onclick="closeM()">Quay lại</button>`}
function pay(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),note=document.getElementById('note').value.trim();if(!name||!phone)return alert('Nhập tên và số điện thoại giúp tiệm nhé.');window.customer={name,phone,note};let t=calc();sheet.innerHTML=`<div class="handle"></div><h2>Thanh toán</h2><div class="pay">${money(t.total)}</div><div class="bank">Ngân hàng: <b>TPBank</b><br>Số tài khoản: <b>01501527102</b><br>Chủ tài khoản: <b>NGUYEN VAN DUC</b></div><div class="qrbox"><div class="hint">Quét QR để chuyển đúng số tiền</div><img src="https://img.vietqr.io/image/TPB-01501527102-compact2.png?amount=${t.total}&addInfo=NHA%20NGO&accountName=NGUYEN%20VAN%20DUC" alt="QR thanh toán TPBank"></div><div class="proof"><label style="margin-top:0">Ảnh xác nhận thanh toán</label><input id="proofFile" type="file" accept="image/*" onchange="previewProof(this)"><img id="proofPreview" class="preview"><div class="hint">Chụp màn hình giao dịch thành công rồi tải ảnh lên.</div></div><button class="primary" onclick="submitOrder()">Xác nhận & gửi đơn</button><button class="secondary" onclick="closeM()">Đóng</button>`}
function previewProof(inp){let f=inp.files&&inp.files[0],im=document.getElementById('proofPreview');if(!f){im.style.display='none';return}im.src=URL.createObjectURL(f);im.style.display='block'}
function fileData(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function submitOrder(){let input=document.getElementById('proofFile'),f=input&&input.files&&input.files[0];if(!f)return alert('Vui lòng tải ảnh xác nhận thanh toán.');if(f.size>6*1024*1024)return alert('Ảnh quá lớn. Vui lòng chọn ảnh dưới 6MB.');let items=products.filter(p=>cart[p.id]>0).map(p=>({id:p.id,qty:cart[p.id]}));let paymentImage=await fileData(f);document.getElementById('payload').value=JSON.stringify({...window.customer,items,paymentImage,paymentImageName:f.name||'thanh-toan.jpg'});document.getElementById('postForm').submit();sheet.innerHTML=`<div class="handle"></div><div class="ok"><div class="tick">✓</div><h2>Đã gửi đơn</h2><p>Tiệm sẽ kiểm tra chuyển khoản và xử lý đơn của bạn.</p><button class="primary" onclick="location.reload()">Hoàn tất</button></div>`}
function closeM(){modal.classList.remove('on')}load();
</script></body></html>
