<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf2"><title>Nhà Ngô - Quản lý</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ed;color:#29241f;font-family:system-ui,-apple-system,Arial,sans-serif}.app{max-width:650px;margin:auto;min-height:100dvh;padding:16px 14px 90px}h1{font-size:25px;margin:4px 0}.muted{color:#766d65;font-size:13px}.login{min-height:85dvh;display:grid;place-items:center}.box,.card{background:#fff;border:1px solid #e9e0d5;border-radius:18px;padding:16px;box-shadow:0 3px 14px #3c28140d}.box{width:100%;max-width:420px}input,select{width:100%;font-size:16px;padding:13px;border:1px solid #ddd3c7;border-radius:12px;background:#fff}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}.btn{border:0;border-radius:13px;min-height:48px;padding:10px 14px;font-size:15px;font-weight:800}.primary{background:#513725;color:white;width:100%}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:sticky;top:0;background:#f7f3edf2;padding:10px 0;z-index:5}.tab{background:#ebe4db;color:#594b40}.tab.on{background:#513725;color:#fff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.refresh{background:#fff;border:1px solid #ded5ca}.card{margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:10px}.oid{font-weight:900;font-size:16px}.money{font-weight:900;font-size:20px;color:#513725}.customer{font-size:17px;font-weight:800;margin-top:10px}.phone{color:#2d6b9f;text-decoration:none}.items{background:#faf7f2;padding:11px;border-radius:11px;margin:10px 0;line-height:1.5}.proofbtn{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:10px 13px;border-radius:11px;background:#eef7f0;color:#287a45;text-decoration:none;font-weight:800;font-size:14px}.statusline{display:flex;align-items:center;gap:10px;margin-top:12px}.statusline .stlabel{font-size:13px;font-weight:800;white-space:nowrap;color:#766d65}.statusline select{flex:1;font-weight:800;color:#513725;background:#fff;min-height:48px}.prodtop{display:grid;grid-template-columns:92px minmax(0,1fr) 112px;align-items:start;gap:12px}.prodimg{width:92px;height:92px;border-radius:15px;object-fit:cover;background:#f1ebe4;flex:0 0 92px}.prodmeta{min-width:0}.imgchange{margin-top:8px;border:1px solid #ded5ca;background:#fff;color:#513725;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800}.topactions{display:grid;gap:7px}.topactions .btn{min-height:40px;padding:7px 8px;font-size:13px}.prodrow{margin-top:10px}.productcard .actions{display:none}@media(max-width:520px){.prodtop{grid-template-columns:92px minmax(0,1fr) 104px}.topactions .btn{font-size:12px}}.prodrow{display:grid;grid-template-columns:1fr 110px;gap:9px}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.save{background:#513725;color:#fff}.danger{background:#fff0ed;color:#a33325}.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:max(16px,calc((100vw - 650px)/2 + 16px));border:0;border-radius:50%;width:58px;height:58px;background:#513725;color:#fff;font-size:30px;box-shadow:0 6px 20px #0003}.empty{text-align:center;color:#777;padding:35px 10px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#29241f;color:white;padding:11px 16px;border-radius:12px;z-index:20;display:none}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.on{display:flex}.sheet{background:white;width:100%;max-width:650px;margin:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
</style></head><body><main class="app" id="app"></main><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyzJFINy2DsPThTCPLcB1E-1PeUmoQxMChiYcJz6wENkEvzdWebII5gxcCMiGebkx5P/exec';const PRODUCT_IMAGES={B001:'https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=500&q=80',B002:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80',B003:'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80',B004:'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?auto=format&fit=crop&w=500&q=80',B005:'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?auto=format&fit=crop&w=500&q=80',B006:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=500&q=80'};let token=localStorage.getItem('ngo_admin_token')||'',data={orders:[],products:[]},tab='orders';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(+n||0).toLocaleString('vi-VN')+' đ';
function jsonp(params){return new Promise((ok,no)=>{let cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];s.remove();no(Error('Máy chủ Google phản hồi chậm. Bấm thử lại.'))},30000);window[cb]=x=>{clearTimeout(timer);delete window[cb];s.remove();ok(x)};s.onerror=()=>{clearTimeout(timer);delete window[cb];s.remove();no(Error('Không kết nối được máy chủ'))};s.src=API+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.body.appendChild(s)})}
function sha256(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}
let challengePromise=null;
function prefetchChallenge(){if(!challengePromise)challengePromise=jsonp({api:'admin-challenge'}).catch(e=>{challengePromise=null;throw e});return challengePromise}
function loginView(msg=''){app.innerHTML=`<div class="login"><div class="box"><h1>🍞 Quản lý Nhà Ngô</h1><p class="muted">Đăng nhập dành cho chủ tiệm</p><label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><p class="muted" style="color:#a33325">${esc(msg)}</p><button id="loginBtn" class="btn primary" onclick="login()">Đăng nhập</button></div></div>`;prefetchChallenge();setTimeout(()=>document.getElementById('pw')?.focus(),100)}
async function login(){let btn=document.getElementById('loginBtn');try{let pw=document.getElementById('pw').value;if(!pw)return;if(btn){btn.disabled=true;btn.textContent='Đang vào...'}let ch=await prefetchChallenge();challengePromise=null;let proof=await sha256(pw+':'+ch.nonce);let r=await jsonp({api:'admin-login',nonce:ch.nonce,proof});if(!r.success)throw Error(r.message||'Sai mật khẩu');token=r.token;localStorage.setItem('ngo_admin_token',token);if(r.data&&r.data.success){data=r.data;render()}else{await load()}}catch(e){challengePromise=null;loginView(e.message)}}
async function load(){try{let r=await jsonp({api:'admin-data',token});if(!r.success){token='';localStorage.removeItem('ngo_admin_token');return loginView('Phiên đăng nhập đã hết.')}data=r;render()}catch(e){loginView(e.message)}}
function render(){let active=data.orders.filter(o=>o.status!=='HOÀN THÀNH'),done=data.orders.filter(o=>o.status==='HOÀN THÀNH');app.innerHTML=`<div class="top"><div><h1>🍞 Nhà Ngô</h1><div class="muted">Quản lý đơn hàng & sản phẩm</div></div><button class="btn refresh" onclick="load()">↻</button></div><div class="tabs"><button class="btn tab ${tab==='orders'?'on':''}" onclick="tab='orders';render()">Đơn hàng (${active.length})</button><button class="btn tab ${tab==='done'?'on':''}" onclick="tab='done';render()">Hoàn thành (${done.length})</button><button class="btn tab ${tab==='products'?'on':''}" onclick="tab='products';render()">Sản phẩm (${data.products.length})</button></div><div id="content"></div>`;tab==='products'?products():orders(tab==='done'?done:active)}
function orders(list){let el=document.getElementById('content');if(!list.length)return el.innerHTML=`<div class="empty">${tab==='done'?'Chưa có đơn hoàn thành.':'Chưa có đơn hàng.'}</div>`;el.innerHTML=list.map(o=>`<div class="card"><div class="orderhead"><div><div class="oid">${esc(o.id)}</div><div class="muted">${esc(o.timeText||'')}</div></div><div class="money">${money(o.total)}</div></div><div class="customer">${esc(o.name)}</div><a class="phone" href="tel:${esc(o.phone)}">☎ ${esc(o.phone)}</a><div class="items">${esc(o.items)}</div>${o.note?`<div class="muted">Ghi chú: ${esc(o.note)}</div>`:''}${/^https:\/\//i.test(o.paymentImage||'')?`<a class="proofbtn" href="${esc(o.paymentImage)}" target="_blank" rel="noopener">📷 Xem ảnh thanh toán</a>`:''}<div class="statusline"><span class="stlabel">Trạng thái</span><select onchange="status('${esc(o.id)}',this.value)" aria-label="Trạng thái đơn ${esc(o.id)}">${['CHỜ XÁC NHẬN','ĐÃ NHẬN TIỀN','ĐANG LÀM','HOÀN THÀNH','HỦY'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join('')}
function products(){let el=document.getElementById('content');el.innerHTML=data.products.map(p=>`<div class="card productcard"><div class="prodtop"><img class="prodimg" src="${p.imageUrl||PRODUCT_IMAGES[p.id]||PRODUCT_IMAGES.B006}" alt="${esc(p.name)}" loading="lazy"><div class="prodmeta"><div class="oid">${esc(p.name)}</div><div class="muted">${esc(p.id)}</div><button class="imgchange" onclick="document.getElementById('img-${p.id}').click()">Đổi ảnh</button><input id="img-${p.id}" type="file" accept="image/*" style="display:none" onchange="previewProductImage('${p.id}',this)"></div><div class="topactions"><button class="btn save" onclick="save('${p.id}','${esc(p.name)}')">Lưu</button><button class="btn danger" onclick="delp('${p.id}')">Xóa</button></div></div><div class="prodrow"><div><label>Giá bán</label><input id="price-${p.id}" inputmode="numeric" value="${p.price}"></div><div><label>Tồn kho</label><input id="stock-${p.id}" inputmode="numeric" value="${p.stock}"></div></div></div>`).join('');app.insertAdjacentHTML('beforeend','<button class="fab" onclick="newp()">+</button>')}
async function post(action,payload){let f=document.createElement('form');f.method='post';f.action=API;f.target='sink';f.style.display='none';let obj={api:action,token,...payload};Object.entries(obj).forEach(([k,v])=>{let i=document.createElement('input');i.name=k;i.value=typeof v==='object'?JSON.stringify(v):v;f.appendChild(i)});let iframe=document.getElementById('sink');if(!iframe){iframe=document.createElement('iframe');iframe.name='sink';iframe.id='sink';iframe.style.display='none';document.body.appendChild(iframe)}document.body.appendChild(f);f.submit();f.remove();await new Promise(r=>setTimeout(r,900));await load()}
async function status(id,status){await post('admin-status',{orderId:id,status});show('Đã cập nhật trạng thái')}
function previewProductImage(id,inp){let f=inp.files&&inp.files[0];if(!f)return;let im=inp.closest('.prodtop').querySelector('.prodimg');im.src=URL.createObjectURL(f)}
async function save(id,name){let inp=document.getElementById('img-'+id),imageData='';if(inp&&inp.files&&inp.files[0])imageData=await productImageData(inp.files[0]);await post('admin-save-product',{product:{id,name,price:+document.getElementById('price-'+id).value,stock:+document.getElementById('stock-'+id).value,active:true,imageData}});show('Đã lưu sản phẩm')}
async function delp(id){if(confirm('Xóa sản phẩm này?')){await post('admin-delete-product',{productId:id});show('Đã xóa')}}
function newp(){modal.classList.add('on');sheet.innerHTML=`<h2>Thêm sản phẩm</h2><label>Mã sản phẩm</label><input id="nid" placeholder="VD: B005"><label>Tên bánh</label><input id="nname"><label>Giá bán</label><input id="nprice" inputmode="numeric"><label>Tồn kho</label><input id="nstock" inputmode="numeric"><label>Ảnh sản phẩm</label><input id="nimg" type="file" accept="image/*"><button class="btn primary" style="margin-top:16px" onclick="addp()">Thêm sản phẩm</button><button class="btn" style="width:100%;margin-top:6px" onclick="modal.classList.remove('on')">Đóng</button>`}
function productImageData(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let max=1200,w=im.width,h=im.height;if(w>max||h>max){let s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);ok(cv.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
async function addp(){let file=nimg.files&&nimg.files[0];if(!file)return alert('Chọn ảnh sản phẩm.');let product={id:nid.value.trim(),name:nname.value.trim(),price:+nprice.value,stock:+nstock.value,active:true,imageData:await productImageData(file)};if(!product.id||!product.name||!product.price)return alert('Nhập đủ mã, tên và giá.');modal.classList.remove('on');await post('admin-save-product',{product});show('Đã thêm sản phẩm')}
function show(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}
token?load():loginView();
</script></body></html>
